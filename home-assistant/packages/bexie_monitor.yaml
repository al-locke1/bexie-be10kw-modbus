          {%- set nsr = namespace(g={}, b={}, p={}, m={}) %}
          {%- if r1 is defined and r1 is mapping %}{% for k, x in r1.items() %}{% set nsr.g = dict(nsr.g, **{k | string: x}) %}{% endfor %}{% endif %}
          {%- if r2 is defined and r2 is mapping %}{% for k, x in r2.items() %}{% set nsr.b = dict(nsr.b, **{k | string: x}) %}{% endfor %}{% endif %}
          {%- if r3 is defined and r3 is mapping %}{% for k, x in r3.items() %}{% set nsr.p = dict(nsr.p, **{k | string: x}) %}{% endfor %}{% endif %}
