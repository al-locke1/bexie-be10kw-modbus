  # ------------------------------------------------- overnight charge record
  # 00:31 notes the battery level; 05:35 records the night's peak charge rate
  # (from sensor.battery_power_low_6h) and the kWh gained. Keeps 14 nights.
  - triggers:
      - trigger: time
        at: "00:31:00"
        id: start
      - trigger: time
        at: "05:35:00"
        id: end
    sensor:
      - name: Battery overnight charge
        unique_id: battery_overnight_charge
        icon: mdi:battery-clock
        unit_of_measurement: kW
        state: >-
          {%- set low = states('sensor.battery_power_low_6h') | float(none) %}
          {{ ((-low / 1000) | round(1)) if trigger.id == 'end' and low is not none else this.state }}
        attributes:
          start_soc: >-
            {{ states('sensor.inverter_battery_soc') | int(none) if trigger.id == 'start' else this.attributes.get('start_soc') }}
          history: >-
            {%- set old = this.attributes.get('history') or [] %}
            {%- if trigger.id == 'end' %}
              {%- set low = states('sensor.battery_power_low_6h') | float(0) %}
              {%- set s0 = this.attributes.get('start_soc') %}
              {%- set s1 = states('sensor.inverter_battery_soc') | int(none) %}
              {{ (old + [{'date': now().date() | string,
                           'peak_kw': ((-low / 1000) | round(1)),
                           'soc_start': s0, 'soc_end': s1,
                           'gained_pct': (s1 - s0) if s0 is number and s1 is number else none}])[-14:] }}
            {%- else %}{{ old }}{% endif %}

  # --------------------------------------------------------------- checks
  - binary_sensor:
      - name: Check inverter settings
        unique_id: check_inverter_settings
        device_class: problem
        icon: mdi:cog-off-outline
        state: "{{ states('sensor.inverter_settings') | int(0) > 0 }}"
        attributes:
          title: Inverter settings changed
          message: >-
            {{ (state_attr('sensor.inverter_settings', 'differences') or []) | join('; ') }}.
            Something other than Home Assistant has changed the inverter (HA never writes these).
            If it wasn't Bexie, check the Bexie app. If it's a firmware update, put the new
            versions in bexie_monitor.yaml to clear this.

      - name: Check inverter fault
        unique_id: check_inverter_fault
        device_class: problem
        icon: mdi:alert-octagon-outline
        state: >-
          {%- set v = state_attr('sensor.inverter_settings', 'values') or {} %}
          {{ (v.get('battery_error_bits') or 0) | int(0) > 0 or (v.get('error_code_1') or 0) | int(0) > 0
             or (v.get('error_code_2') or 0) | int(0) > 0 or (v.get('error_code_3') or 0) | int(0) > 0
             or (v.get('inverter_mode') is number and v.get('inverter_mode') == 5) }}
        attributes:
          title: Inverter reporting a fault
          message: >-
            {%- set v = state_attr('sensor.inverter_settings', 'values') or {} %}
            {%- set bits = (v.get('battery_error_bits') or 0) | int(0) %}
            {%- set names = ['battery absent', 'battery over voltage', 'battery under voltage', 'battery discharge over current',
                             'battery over temperature', 'battery under temperature', 'neutral and live reversed', 'backup output voltage abnormal',
                             'inverter-BMS communication error', 'internal communication loss (E-M)', 'internal communication loss (M-D)', 'DCDC abnormal',
                             'backup DC bias', 'backup short circuit', 'backup overload', 'reserved'] %}
            {%- set ns = namespace(f=[]) %}
            {%- for i in range(16) if (bits // (2 ** i)) % 2 == 1 %}{% set ns.f = ns.f + [names[i]] %}{% endfor %}
            {%- if ns.f %}Battery/backup: {{ ns.f | join(', ') }}. {% endif %}
            {%- if (v.get('error_code_1') or 0) | int(0) or (v.get('error_code_2') or 0) | int(0) or (v.get('error_code_3') or 0) | int(0) %}Inverter error codes 1/2/3: {{ v.get('error_code_1') }}/{{ v.get('error_code_2') }}/{{ v.get('error_code_3') }} (inverter, grid/PV, logger/meter tables). {% endif %}
            {%- if v.get('inverter_mode') == 5 %}Inverter mode: Fault.{% endif %}
            Check the Bexie app's logs.

      - name: Check battery not charging
        unique_id: check_battery_not_charging
        device_class: problem
        icon: mdi:battery-alert-variant-outline
        state: >-
          {{ is_state('sun.sun', 'above_horizon')
             and is_state('select.inverter_work_mode', 'Self Use')
             and states('sensor.inverter_battery_soc') | float(100) < 95
             and states('sensor.inverter_grid_power') | float(0) < -800
             and states('sensor.inverter_battery_power') | float(0) > -300 }}
        delay_on: "00:15:00"
        delay_off: "00:05:00"
        attributes:
          title: Battery not taking spare solar
          message: >-
            {%- set v = states('sensor.inverter_battery_voltage') | float(0) %}
            {%- set la = (state_attr('sensor.inverter_settings', 'values') or {}).get('lead_acid_stop_charge_v') %}
            The battery is at {{ states('sensor.inverter_battery_soc') }}% and taking only {{ [-(states('sensor.inverter_battery_power') | float(0)), 0] | max | round(0) }} W,
            while {{ (-(states('sensor.inverter_grid_power') | float(0))) | round(0) }} W goes to the grid. Battery voltage {{ v }} V
            {%- if la is number and (v - la) | abs <= 0.3 %}, right at the {{ la }} V lead-acid stop-charge setting{% endif %}.

      - name: Check grid charge slow
        unique_id: check_grid_charge_slow
        device_class: problem
        icon: mdi:battery-charging-low
        state: >-
          {{ is_state('select.inverter_work_mode', 'Back-up')
             and is_state('switch.inverter_grid_charge', 'on')
             and states('sensor.inverter_battery_soc') | float(100) < states('number.inverter_grid_charge_end_soc') | float(0) - 3
             and states('sensor.inverter_battery_power') | float(0) > -2500 }}
        delay_on: "00:15:00"
        delay_off: "00:05:00"
        attributes:
          title: Battery grid charging slowly
          message: >-
            Grid charging to {{ states('number.inverter_grid_charge_end_soc') }}%, but the battery is taking only
            {{ [-(states('sensor.inverter_battery_power') | float(0)), 0] | max | round(0) }} W
            ({{ states('sensor.inverter_battery_current') }} A at {{ states('sensor.inverter_battery_voltage') }} V, {{ states('sensor.inverter_battery_soc') }}%).
            It normally takes 5-10 kW.

sensor:
  # lowest battery power (most negative = fastest charge) over the last 6 hours
  - platform: statistics
    name: Battery power low 6h
    unique_id: battery_power_low_6h
    entity_id: sensor.inverter_battery_power
    state_characteristic: value_min
    max_age:
      hours: 6
    sampling_size: 5000

automation:
  - id: bexie_monitor_check_alert
    alias: Bexie monitor - check alert
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.check_inverter_settings
          - binary_sensor.check_inverter_fault
          - binary_sensor.check_battery_not_charging
          - binary_sensor.check_grid_charge_slow
        from: ["off", "on"]
        to: ["on", "off"]
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.house_notify
        data:
          variables:
            title: "{{ ('Check: ' if trigger.to_state.state == 'on' else 'Cleared: ') ~ trigger.to_state.attributes.title }}"
            message: >-
              {%- if trigger.to_state.state == 'on' %}{{ trigger.to_state.attributes.message | trim }}
              {%- else %}This has sorted itself out ({{ now().strftime('%H:%M') }}).{% endif %}
            tag: "{{ trigger.entity_id | replace('binary_sensor.', '') }}"
        continue_on_error: true

  # A setting changed between two reads: say what, straight away.
  - id: bexie_settings_changed
    alias: Bexie monitor - inverter setting changed
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.inverter_settings
        attribute: changes
    conditions:
      - condition: template
        value_template: "{{ (trigger.to_state.attributes.changes or []) | count > 0 }}"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.house_notify
        data:
          variables:
            title: Inverter setting changed
            message: >-
              At {{ now().strftime('%H:%M') }}: {{ trigger.to_state.attributes.changes | join('; ') }}.
              Home Assistant doesn't write these, so this was done from the Bexie app or remotely.
            tag: bexie-settings-changed
        continue_on_error: true

  # Inverter offline while it was grid charging: it can't be stopped at 05:30.
  - id: bexie_offline_while_charging
    alias: Bexie monitor - inverter offline while grid charging
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter_connection
        to: "off"
        for: "00:05:00"
        id: offline
      - trigger: time
        at: "05:35:00"
        id: reminder
    conditions:
      - condition: template
        value_template: >-
          {{ not is_state('binary_sensor.inverter_connection', 'on')
             and (states('input_select.bexie_battery_mode') in ['Charging', 'Holding']
                  or '00:25' <= now().strftime('%H:%M') < '05:40') }}
    actions:
      - variables:
          svc: "{{ states('input_text.security_notify_service') | replace('notify.', '') | trim }}"
      - condition: template
        value_template: "{{ svc not in ['', 'unknown', 'unavailable'] }}"
      - action: "notify.{{ svc }}"
        data:
          title: Inverter offline while grid charging
          message: >-
            {%- if trigger.id == 'reminder' %}Still offline at 05:35, so Home Assistant couldn't end the night charge.
            {%- else %}Home Assistant lost the inverter at {{ (now() - timedelta(minutes=5)).strftime('%H:%M') }} while it was grid charging.{% endif %}
            It may stay in Back-up with grid charge on, charging and running the house from the grid at the day rate.
            Restart the inverter's link, or set Self Use with grid charge off in the Bexie app.
          data:
            tag: bexie-offline-charging
            priority: high
            ttl: 0
        continue_on_error: true
