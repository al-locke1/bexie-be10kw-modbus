          {%- set ok = g.get('8464') is not none %}
          {%- set t = b.get('8193') %}
          {%- set v = {
            'battery_type': g.get('8464'),
            'bms_address': g.get('8465'),
            'lead_acid_ah': g.get('8466'),
            'lead_acid_stop_discharge_v': (g.get('8467') / 10) if g.get('8467') is number else none,
