# =============================================================================
# BEXIE INVERTER MONITOR  ·  Save as /config/packages/bexie_monitor.yaml   (12 Nov 2026)
#
# Watches the inverter's own settings and how the battery is actually charging,
# using the register map in docs/registers.md (from the generic "Modbus Protocol
# V1.2" document). Read only: nothing here writes to the inverter.
#
# BEFORE YOU USE THIS
#   - Needs the ha-solarman integration with the Bexie profile. Entity names here
#     are the ones that profile creates with the device named "Inverter"
#     (sensor.inverter_battery_soc, select.inverter_work_mode and so on).
#   - The "known-good" values (the exp dictionary, repeated in each template) are
#     from one BE10KW-1PH system, including its firmware versions. Change them to
#     match yours, or the check will report differences straight away.
#   - Alerts go through script.house_notify (fields: title, message, tag) and the
#     notify service named in input_text.security_notify_service. Replace both
#     with your own notification.
#   - input_select.bexie_battery_mode comes from predbat_bexie.yaml.
#   - The 5 kW / 10 kW max charge values and the 00:30-05:30 window are specific
#     to this system's car charging and tariff.
#
# sensor.inverter_settings
#   Every 15 minutes (and at start-up) reads the inverter's battery, charge, meter
#   and AC-coupling settings, the capacity mode (SOC or voltage), firmware versions,
#   inverter mode and error codes. It also keeps register 0x2001 (the generic map calls it
#   battery temperature, but on this Bexie it doesn't match the app's battery
#   temperature, so it's recorded for reference only and not alerted on).
#   State = how many settings differ from the known-good values. Attributes:
#   values, differences from expected, what changed since the last read (not
#   counting register 0x2001 or the car's 5 kW limit), read time.
#   The settings HA itself controls (work mode, grid charge, charge target, the
#   car's 5 kW limit) are left out of the comparison.
#   The known-good values include capacity mode (0 = SOC) and the firmware versions,
#   so a revert or a firmware update is flagged even if HA restarts in between.
#   After a planned firmware update, put the new versions in 'firmware_block' and
#   'ems_firmware' below (13 Nov 2026: EMS 01140310004-07261008).
#   Fire event bexie_monitor_refresh (Developer tools > Events) to read it now.
#
# Checks (binary_sensor.check_*, so they show in sensor.system_checks too), each
# with a phone alert when it turns on and when it clears:
#   check_inverter_settings      a setting differs from the known-good value
#   check_inverter_fault         the inverter reports a battery/backup fault bit (0x2013,
#                                decoded), an inverter/grid/meter error code, or Fault mode
#   check_battery_not_charging   daytime, Self Use, battery under 95%, exporting
#                                800 W+ while the battery takes under 300 W, 15 min
#   check_grid_charge_slow       grid charging but the battery takes under 2.5 kW
#                                and is 3%+ short of the target, 15 min
#
# Urgent alerts:
#   - a setting changes between two reads (e.g. a remote change by Bexie): straight
#     away, with old and new values;
#   - the inverter goes offline while it was grid charging (00:30-05:30, or the
#     battery bridge was Charging/Holding): HA can't stop the charge at 05:30, so it
#     may keep charging and running the house from the grid at the day rate.
#     Repeated at 05:35 if it is still offline.
#
# sensor.battery_overnight_charge: the night's peak charge rate and kWh gained,
# kept for 14 nights, so it's easy to see whether a fix has worked.
# =============================================================================
template:
  # --------------------------------------------------------- inverter settings
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: bexie_monitor_refresh
    actions:
      # at start-up give the inverter link a moment
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - delay: "00:01:30"
      - action: solarman.read_holding_registers
        data:
          device: "{{ device_id('sensor.inverter_battery_soc') }}"
          address: 8448
          count: 81
        response_variable: r1
        continue_on_error: true
      - action: solarman.read_holding_registers
        data:
          device: "{{ device_id('sensor.inverter_battery_soc') }}"
          address: 8192
          count: 28
        response_variable: r2
        continue_on_error: true
      - action: solarman.read_holding_registers
        data:
          device: "{{ device_id('sensor.inverter_battery_soc') }}"
          address: 6681
          count: 82
        response_variable: r3
        continue_on_error: true
      - action: solarman.read_holding_registers
        data:
          device: "{{ device_id('sensor.inverter_battery_soc') }}"
          address: 12464
          count: 11
        response_variable: r4
        continue_on_error: true
      - action: solarman.read_holding_registers
        data:
          device: "{{ device_id('sensor.inverter_battery_soc') }}"
          address: 4125
          count: 4
        response_variable: r5
        continue_on_error: true
